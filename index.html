<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPO — Vemba Process Optimizer</title>
    <meta name="description" content="VPO · Vemba Process Optimizer — simulação, otimização multiobjectivo e dimensionamento de separadores de produção.">
    <meta name="theme-color" content="#0b1220">

    <!-- Plotly.js (CDN pinned; add SRI hash em produção) -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" crossorigin="anonymous"></script>

    <!-- TensorFlow.js (CDN pinned; add SRI hash em produção) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.13.0/dist/tf.min.js" crossorigin="anonymous"></script>

    <!-- Fonts: Inter (UI) + JetBrains Mono (dados) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Favicon VPO (marca própria: gota + V estilizado, cor Vemba) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2306b6d4'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M32 10c-9 12-14 20-14 28a14 14 0 0 0 28 0c0-8-5-16-14-28z' fill='url(%23g)'/%3E%3Cpath d='M22 28 L32 50 L42 28' stroke='%230b1220' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <style>
        /* ============================================
           VPO · DESIGN TOKENS (Industrial Dark — WCAG AAA)
           Inspirado em Carbon / Linear / Palantir Workshop.
           Contrastes verificados: ≥ 7:1 em texto primário/secundário
           sobre bg-primary (#0b1220).
           ============================================ */
        :root {
            /* Superfícies (slate 950→800 + canvas elevado) */
            --bg-primary: #0b1220;      /* canvas base */
            --bg-secondary: #111a2c;    /* painéis */
            --bg-tertiary: #162138;     /* cards, inputs */
            --bg-hover: #1a2742;
            --bg-active: #22304f;
            --bg-input: #0f1829;
            --surface-hi: rgba(255,255,255,0.04); /* elevação por luz */

            /* Bordas */
            --border-color: #1f2a44;
            --border-strong: #2a3756;
            --border-active: #06b6d4;

            /* Texto (AAA ≥ 7:1 sobre bg-primary) */
            --text-primary: #f1f5f9;    /* ratio ≈ 15.6:1 */
            --text-secondary: #cbd5e1;  /* ratio ≈ 11.4:1 */
            --text-muted: #94a3b8;      /* ratio ≈ 7.2:1 */
            --text-bright: #ffffff;
            --text-white: #ffffff;
            --text-inverse: #0b1220;

            /* Accent — Vemba Cyan */
            --accent: #06b6d4;
            --accent-hover: #22d3ee;
            --accent-dark: #0891b2;
            --accent-subtle: rgba(6, 182, 212, 0.14);
            --accent-ghost: rgba(6, 182, 212, 0.08);

            /* Paleta semântica para dados (não cores de syntax) */
            --data-1: #06b6d4;  /* cyan   */
            --data-2: #a78bfa;  /* violet */
            --data-3: #f59e0b;  /* amber  */
            --data-4: #10b981;  /* emerald*/
            --data-5: #f472b6;  /* pink   */
            --data-6: #60a5fa;  /* blue   */

            /* Aliases legados (mantém cores existentes mapeadas para a nova paleta) */
            --syntax-green: #10b981;
            --syntax-blue: #60a5fa;
            --syntax-lightblue: #67e8f9;   /* valores numéricos */
            --syntax-purple: #a78bfa;
            --syntax-yellow: #fbbf24;
            --syntax-orange: #fb923c;
            --syntax-teal: #2dd4bf;

            /* Status (verdadeiras semânticas) */
            --success: #10b981;
            --success-weak: rgba(16, 185, 129, 0.12);
            --warning: #f59e0b;
            --warning-weak: rgba(245, 158, 11, 0.12);
            --error: #ef4444;
            --error-weak: rgba(239, 68, 68, 0.12);
            --info: #3b82f6;
            --info-weak: rgba(59, 130, 246, 0.12);

            /* Espaçamento — 4pt scale */
            --spacing-xs: 0.25rem;  /* 4  */
            --spacing-sm: 0.5rem;   /* 8  */
            --spacing-md: 1rem;     /* 16 */
            --spacing-lg: 1.5rem;   /* 24 */
            --spacing-xl: 2rem;     /* 32 */
            --spacing-2xl: 3rem;    /* 48 */

            /* Tipografia — Inter (UI) · JetBrains Mono (dados) */
            --font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Consolas, 'Courier New', monospace;
            --font-ui: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

            --font-size-xs: 0.75rem;    /* 12 */
            --font-size-sm: 0.8125rem;  /* 13 */
            --font-size-base: 0.9375rem;/* 15 */
            --font-size-lg: 1rem;       /* 16 */
            --font-size-xl: 1.125rem;   /* 18 */
            --font-size-2xl: 1.5rem;    /* 24 */
            --font-size-3xl: 2rem;      /* 32 */
            --font-size-4xl: 2.5rem;    /* 40 */

            /* Sombras */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45);
            --shadow-glow: 0 0 0 1px var(--border-active), 0 8px 24px rgba(6,182,212,0.18);

            /* Raios */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 10px;
            --radius-xl: 14px;

            /* Foco acessível */
            --focus-ring: 0 0 0 2px var(--bg-primary), 0 0 0 4px var(--accent);

            /* Transições */
            --transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'ss01', 'cv11';
        }

        /* Tipografia: numéricos tabulares em TODO contexto de dados */
        .metric-value, .input-value, .numeric,
        td, th, .mono, code, pre,
        input[type="number"], input[type="range"] + .input-value,
        .chat-bubble .val, .chat-bubble td, .chat-bubble th,
        .formula-card .formula, .spec-card span {
            font-variant-numeric: tabular-nums;
            font-feature-settings: 'tnum' 1, 'lnum' 1;
        }

        /* Hierarquia global de texto */
        h1, h2, h3, h4, h5 {
            font-family: var(--font-display);
            letter-spacing: -0.01em;
        }

        /* Foco global acessível (WCAG 2.4.7) */
        :focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-radius: var(--radius-sm);
        }
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        a:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        /* ============================================
           LAYOUT PRINCIPAL
           ============================================ */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* App Bar — identidade de produto em primeiro lugar */
        .app-header {
            background: linear-gradient(180deg, var(--bg-secondary), var(--bg-primary));
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: saturate(140%) blur(6px);
        }

        .header-content {
            max-width: 100%;
            margin: 0 auto;
            padding: 10px var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-md);
            min-height: 56px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title h1 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-bright);
            font-family: var(--font-display);
            letter-spacing: -0.01em;
            line-height: 1;
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
        }

        .header-title h1 .product-sub {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .env-badge {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 3px 7px;
            border-radius: 999px;
            background: var(--warning-weak);
            color: var(--warning);
            border: 1px solid rgba(245,158,11,0.4);
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #06b6d4, #0ea5e9);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(6,182,212,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .logo-icon svg {
            width: 18px;
            height: 18px;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: var(--font-size-lg);
            cursor: pointer;
            color: var(--text-secondary);
            padding: var(--spacing-xs);
            box-shadow: none;
        }

        .menu-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            box-shadow: none;
            transform: none;
        }

        /* Main content */
        .app-main {
            display: flex;
            flex: 1;
            width: 100%;
        }

        /* Activity Bar — REMOVIDO (chrome de IDE sem função). Mantido como no-op para compat. */
        .activity-bar { display: none !important; }

        .activity-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            border-left: 2px solid transparent;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            transition: color 0.15s ease;
        }

        .activity-btn:hover {
            color: var(--text-white);
            background: none;
            box-shadow: none;
            transform: none;
        }

        .activity-btn.active {
            color: var(--text-white);
            border-left-color: var(--text-white);
        }

        .activity-btn svg {
            width: 22px;
            height: 22px;
        }

        .activity-spacer {
            flex: 1;
        }

        /* Sidebar Panel - collapsible */
        .sidebar-wrapper {
            display: flex;
            flex-shrink: 0;
        }

        .sidebar {
            width: 300px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 0;
            overflow-y: auto;
            overflow-x: hidden;
            transition: width 0.2s var(--ease-out);
        }

        .sidebar.collapsed {
            width: 0;
            border-right: none;
            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: space-between;
            padding: 12px 14px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-family: var(--font-ui);
            white-space: nowrap;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .sidebar-header .reset-all {
            font-size: 10px;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            color: var(--text-muted);
            background: transparent;
            padding: 3px 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .sidebar-header .reset-all:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-ghost);
        }

        .sidebar-header button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px;
            font-size: 14px;
            box-shadow: none;
            line-height: 1;
        }

        .sidebar-header button:hover {
            color: var(--text-white);
            background: none;
        }

        .sidebar-section {
            margin-bottom: 0;
        }

        .sidebar-section h3 {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 10px 14px;
            background: transparent;
            margin: 0;
            cursor: pointer;
            user-select: none;
            font-family: var(--font-ui);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            border-top: 1px solid var(--border-color);
        }

        .sidebar-section:first-of-type h3 { border-top: none; }

        .sidebar-section h3::before {
            content: '';
            display: inline-block;
            width: 0;
            height: 0;
            border-left: 4px solid var(--text-muted);
            border-top: 3px solid transparent;
            border-bottom: 3px solid transparent;
            transition: transform 0.15s var(--ease-out);
            margin-right: 2px;
        }

        .sidebar-section.open h3::before { transform: rotate(90deg); border-left-color: var(--accent); }

        .sidebar-section h3:hover { color: var(--text-primary); background: var(--bg-tertiary); }

        .sidebar-section .section-body {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.25s var(--ease-out);
        }

        .sidebar-section.open .section-body { max-height: 900px; }

        /* Compound Input (slider + número + unidade) — padrão industrial */
        .input-group {
            margin-bottom: 0;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .input-group:last-child { border-bottom: none; }

        .input-group label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-family: var(--font-ui);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        .input-value {
            font-weight: 600;
            color: var(--text-bright);
            background: transparent;
            padding: 0;
            font-family: var(--font-family);
            font-size: 13px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .input-value .unit {
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 500;
            margin-left: 3px;
            text-transform: lowercase;
            letter-spacing: 0;
        }

        /* Bounds em micro texto abaixo do slider */
        .input-bounds {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            font-family: var(--font-family);
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
        }

        /* Health dot (verde/âmbar/vermelho) à esquerda do rótulo */
        .param-health {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            margin-right: 6px;
            vertical-align: middle;
            transition: background 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
        }
        .param-health.ok   { background: var(--success); box-shadow: 0 0 6px rgba(16,185,129,0.45); }
        .param-health.warn { background: var(--warning); box-shadow: 0 0 6px rgba(245,158,11,0.45); }
        .param-health.crit { background: var(--error);   box-shadow: 0 0 6px rgba(239,68,68,0.5); }

        /* Chip delta vs baseline */
        .delta-vs-base {
            font-family: var(--font-family);
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 1px 6px;
            border-radius: 999px;
            background: transparent;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transition: var(--transition);
        }
        .delta-vs-base.changed  { color: var(--accent); background: var(--accent-ghost); }
        .delta-vs-base.positive { color: var(--accent); background: var(--accent-ghost); }
        .delta-vs-base.negative { color: var(--accent); background: var(--accent-ghost); }

        /* Click-to-edit do valor */
        .input-value { cursor: text; user-select: none; }
        .input-value:hover { background: var(--bg-tertiary); border-radius: 4px; padding: 0 4px; margin: 0 -4px; }
        .input-edit {
            width: 90px;
            background: var(--bg-primary);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 2px 6px;
            color: var(--text-bright);
            font-family: var(--font-family);
            font-size: 13px;
            font-weight: 600;
            text-align: right;
            font-variant-numeric: tabular-nums;
            outline: none;
        }

        /* Cenário: dropdown + ações */
        .scenario-bar {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-primary);
        }
        .scenario-bar label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }
        .scenario-row { display: flex; gap: 6px; align-items: center; }

        .scenario-select {
            flex: 1;
            appearance: none;
            -webkit-appearance: none;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-strong);
            color: var(--text-bright);
            padding: 7px 28px 7px 12px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-family: var(--font-ui);
            font-weight: 500;
            cursor: pointer;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 3.5l3 3 3-3' fill='none' stroke='%2394a3b8' stroke-width='1.5' stroke-linecap='round'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
        }
        .scenario-select:hover { border-color: var(--accent); }
        .scenario-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ghost); outline: none; }

        .icon-btn {
            width: 32px; height: 32px;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }
        .icon-btn:hover { color: var(--text-bright); border-color: var(--accent); background: var(--accent-ghost); box-shadow: none; }
        .icon-btn svg { width: 14px; height: 14px; }

        /* Contador na secção + indicador de alterados */
        .sidebar-section h3 .section-counter {
            margin-left: auto;
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0;
            text-transform: none;
        }
        .sidebar-section h3 .section-counter .dot-mod {
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 4px;
            vertical-align: middle;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .sidebar-section.has-mods h3 .section-counter .dot-mod { opacity: 1; }

        /* Scrollbar custom para a sidebar */
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Collapse to rail (barra de 44px só com chevron para re-expandir) */
        .sidebar.rail {
            width: 44px;
        }
        .sidebar.rail > *:not(.rail-expand) { display: none; }
        .rail-expand {
            display: none;
            width: 44px; height: 44px;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            border-radius: 0;
        }
        .rail-expand:hover { color: var(--accent); background: var(--accent-ghost); box-shadow: none; }
        .sidebar.rail .rail-expand { display: flex; }

        /* Range inputs — track + thumb polido */
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--pct, 50%), var(--bg-input) var(--pct, 50%), var(--bg-input) 100%);
            outline: none;
            -webkit-appearance: none;
            transition: background 0.1s linear;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 0 6px var(--accent-ghost), 0 1px 4px rgba(0,0,0,0.4);
        }

        input[type="range"]:focus-visible::-webkit-slider-thumb {
            box-shadow: 0 0 0 4px var(--accent-subtle), 0 1px 4px rgba(0,0,0,0.4);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            transition: transform 0.15s ease;
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.15);
        }

        /* Number inputs */
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-family: var(--font-family);
            background: var(--bg-input);
            color: var(--text-primary);
            transition: var(--transition);
            font-variant-numeric: tabular-nums;
        }

        input[type="number"]:hover, input[type="text"]:hover {
            border-color: var(--border-strong);
        }

        input[type="number"]:focus, input[type="text"]:focus {
            border-color: var(--accent);
            background: var(--bg-primary);
        }

        /* Main content area */
        .main-content {
            flex: 1;
            padding: 0;
            overflow-y: auto;
            background: var(--bg-primary);
        }

        /* Segmented nav — barra de módulos profissional */
        .tabs {
            display: flex;
            gap: 2px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0;
            overflow-x: auto;
            scrollbar-width: thin;
            padding: 6px 14px 0 14px;
        }

        .tabs::-webkit-scrollbar { height: 4px; }
        .tabs::-webkit-scrollbar-track { background: transparent; }
        .tabs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

        .tab {
            padding: 9px 14px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            font-family: var(--font-ui);
            border-radius: 0;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            position: relative;
            bottom: -1px;
        }

        .tab .tab-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            opacity: 0.8;
        }

        .tab.active .tab-icon { opacity: 1; }

        .tab .tab-icon svg { width: 15px; height: 15px; display: block; }

        .tab:hover {
            color: var(--text-primary);
            background: transparent;
            box-shadow: none;
        }

        .tab.active {
            color: var(--text-bright);
            background: transparent;
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        /* Tab content */
        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease;
            padding: var(--spacing-lg);
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Cards (superfície elevada por luz, não por borda) */
        .card {
            background: var(--bg-secondary);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.025), transparent 40%);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .card:hover {
            border-color: var(--border-strong);
        }

        .card-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
            font-family: var(--font-ui);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Métricas KPI — hero numbers */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .metric-card {
            background: var(--bg-secondary);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 55%);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: "";
            position: absolute; inset: 0 auto auto 0;
            width: 3px; height: 100%;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.2s var(--ease-out);
        }

        .metric-card:hover {
            border-color: var(--border-strong);
            transform: none;
        }
        .metric-card:hover::before { opacity: 1; }

        .metric-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--spacing-xs);
            font-family: var(--font-ui);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .metric-label .metric-ref {
            font-size: 10px;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            color: var(--text-muted);
            opacity: 0.75;
        }

        .metric-value {
            font-size: clamp(26px, 2.6vw, 34px);
            font-weight: 600;
            color: var(--text-bright);
            margin-bottom: 10px;
            font-family: var(--font-display);
            line-height: 1.05;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            display: flex;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap;
        }

        .metric-value .metric-unit {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: lowercase;
            letter-spacing: 0;
            font-family: var(--font-ui);
            font-variant-numeric: tabular-nums;
        }

        .metric-delta {
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-ui);
            font-variant-numeric: tabular-nums;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid transparent;
        }
        .metric-delta .arrow { font-size: 9px; line-height: 1; }
        .metric-delta.positive { color: var(--success); background: var(--success-weak); border-color: rgba(16,185,129,0.25); }
        .metric-delta.negative { color: var(--error);   background: var(--error-weak);   border-color: rgba(239,68,68,0.25); }

        .metric-delta.positive {
            color: var(--success);
        }

        .metric-delta.negative {
            color: var(--error);
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        /* Status Grid */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .status-item {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-xs);
        }

        .status-item strong {
            display: block;
            color: var(--text-primary);
            margin-bottom: 2px;
            font-family: var(--font-ui);
        }

        /* Formulas Grid */
        .formulas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--spacing-md);
            margin: var(--spacing-md) 0;
        }

        .formula-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: var(--spacing-md);
            border-radius: var(--radius-lg);
            transition: var(--transition);
        }

        .formula-card:hover {
            border-color: var(--syntax-purple);
            transform: translateY(-2px);
        }

        .formula-card strong {
            display: block;
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-xs);
            color: var(--syntax-purple);
            font-family: var(--font-ui);
        }

        .formula-card .formula {
            font-family: var(--font-family);
            font-size: var(--font-size-xs);
            color: var(--syntax-yellow);
        }

        /* Calculator Grid */
        .calculator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: var(--spacing-md);
            margin: var(--spacing-md) 0;
        }

        .calculator-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
        }

        /* Botões */
        button {
            background: var(--accent);
            color: var(--text-inverse);
            border: 1px solid transparent;
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: 600;
            font-family: var(--font-ui);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.005em;
        }

        button:hover {
            background: var(--accent-hover);
            box-shadow: 0 2px 10px rgba(6,182,212,0.25);
        }

        button:active {
            background: var(--accent-dark);
            transform: translateY(1px);
        }

        button[disabled] { opacity: 0.5; cursor: not-allowed; }

        .btn-ghost {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-ghost:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
            color: var(--text-bright);
            box-shadow: none;
        }

        /* Result Boxes */
        .result-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--success);
            border-left: 4px solid var(--success);
            color: var(--success);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin: var(--spacing-md) 0;
            font-size: var(--font-size-base);
            font-weight: 600;
            text-align: center;
            font-family: var(--font-family);
        }

        .info-box {
            background: rgba(55, 148, 255, 0.08);
            border-left: 4px solid var(--info);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-sm);
            margin: var(--spacing-sm) 0;
            font-size: var(--font-size-xs);
            color: var(--text-primary);
        }

        .warning-box {
            background: rgba(204, 167, 0, 0.08);
            border-left: 4px solid var(--warning);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-sm);
            margin: var(--spacing-sm) 0;
            font-size: var(--font-size-xs);
            color: var(--text-primary);
        }

        .success-box {
            background: rgba(78, 201, 176, 0.08);
            border-left: 4px solid var(--success);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-sm);
            margin: var(--spacing-sm) 0;
            font-size: var(--font-size-xs);
            color: var(--text-primary);
        }

        /* Headings */
        h3 {
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--syntax-blue);
            margin: var(--spacing-lg) 0 var(--spacing-md) 0;
            font-family: var(--font-ui);
        }

        h4 {
            font-size: var(--font-size-base);
            font-weight: 600;
            color: var(--text-bright);
            margin: var(--spacing-md) 0 var(--spacing-sm) 0;
            font-family: var(--font-ui);
        }

        /* ============================================
           RESPONSIVIDADE
           ============================================ */
        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .calculator-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header-content {
                padding: 6px var(--spacing-md);
            }

            .menu-toggle {
                display: block;
            }

            .activity-bar {
                display: none;
            }

            .sidebar-wrapper {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 1001;
                transform: translateX(-100%);
                transition: transform 0.2s ease;
            }

            .sidebar-wrapper.active {
                transform: translateX(0);
            }

            .sidebar-wrapper .sidebar {
                width: 240px;
                box-shadow: var(--shadow-lg);
            }

            .sidebar-wrapper .sidebar.collapsed {
                width: 240px;
                border-right: 1px solid var(--border-color);
                overflow-y: auto;
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.6);
                z-index: 1000;
            }

            .sidebar-overlay.active {
                display: block;
            }

            .tab-content {
                padding: var(--spacing-md);
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .formulas-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                gap: 0;
            }

            .tab {
                padding: 6px 10px;
                font-size: var(--font-size-xs);
            }
        }

        @media (max-width: 480px) {
            .metric-value {
                font-size: var(--font-size-xl);
            }

            .card {
                padding: var(--spacing-md);
            }
        }

        /* ============================================
           SCROLLBAR - VS Code Style
           ============================================ */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(121, 121, 121, 0.4);
            border-radius: 0;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(121, 121, 121, 0.7);
        }

        ::-webkit-scrollbar-corner {
            background: var(--bg-primary);
        }

        /* ============================================
           LOADING STATE
           ============================================ */
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           SELECTION COLORS
           ============================================ */
        ::selection {
            background: rgba(0, 122, 204, 0.3);
            color: var(--text-white);
        }

        /* ============================================
           LIGHT THEME (alinhado ao novo sistema)
           ============================================ */
        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-hover: #e2e8f0;
            --bg-active: #cbd5e1;
            --bg-input: #ffffff;
            --surface-hi: rgba(0,0,0,0.03);

            --border-color: #e2e8f0;
            --border-strong: #cbd5e1;
            --border-active: #06b6d4;

            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --text-bright: #020617;
            --text-white: #ffffff;
            --text-inverse: #ffffff;

            --accent: #0891b2;
            --accent-hover: #06b6d4;
            --accent-dark: #0e7490;
            --accent-subtle: rgba(8, 145, 178, 0.10);
            --accent-ghost: rgba(8, 145, 178, 0.06);

            --syntax-green: #047857;
            --syntax-blue: #2563eb;
            --syntax-lightblue: #0e7490;
            --syntax-purple: #7c3aed;
            --syntax-yellow: #b45309;
            --syntax-orange: #c2410c;
            --syntax-teal: #0f766e;

            --success: #047857;
            --success-weak: rgba(4, 120, 87, 0.10);
            --warning: #b45309;
            --warning-weak: rgba(180, 83, 9, 0.10);
            --error: #b91c1c;
            --error-weak: rgba(185, 28, 28, 0.10);
            --info: #1d4ed8;
            --info-weak: rgba(29, 78, 216, 0.10);

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.12);
            --focus-ring: 0 0 0 2px #ffffff, 0 0 0 4px var(--accent);
        }

        [data-theme="light"] .app-header {
            background: linear-gradient(180deg, #ffffff, #f8fafc);
        }

        [data-theme="light"] .activity-bar {
            background: var(--bg-tertiary);
            border-right: 1px solid var(--border-color);
        }

        [data-theme="light"] .activity-btn { color: var(--text-muted); }
        [data-theme="light"] .activity-btn:hover,
        [data-theme="light"] .activity-btn.active { color: var(--text-bright); }

        [data-theme="light"] .tabs { background: var(--bg-primary); }
        [data-theme="light"] .tab { background: transparent; color: var(--text-muted); }
        [data-theme="light"] .tab.active { background: transparent; color: var(--text-bright); }
        [data-theme="light"] .tab:hover { background: transparent; color: var(--text-primary); }

        [data-theme="light"] .info-box { background: var(--info-weak); }
        [data-theme="light"] .warning-box { background: var(--warning-weak); }
        [data-theme="light"] .success-box { background: var(--success-weak); }
        [data-theme="light"] .result-box { background: var(--bg-secondary); }

        [data-theme="light"] ::selection {
            background: var(--accent-subtle);
            color: var(--text-bright);
        }

        [data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.35); }
        [data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.6); }

        /* Theme Toggle Button */
        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            border-radius: var(--radius-sm);
            width: 28px;
            height: 28px;
        }

        .theme-toggle:hover {
            color: var(--text-white);
            background: var(--bg-hover);
            box-shadow: none;
            transform: none;
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
        }

        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }

        [data-theme="light"] .theme-toggle .icon-sun { display: block; }
        [data-theme="light"] .theme-toggle .icon-moon { display: none; }

        [data-theme="light"] .theme-toggle:hover {
            color: var(--text-bright);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================
           ASSISTENTE VPO — Chat
           ============================================ */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 110px);
            background: var(--bg-primary);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl) var(--spacing-lg);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            align-items: center;
        }

        .chat-msg {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 780px;
            animation: chatSlideIn 0.25s var(--ease-out);
        }

        @keyframes chatSlideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-msg.ai { align-self: center; flex-direction: row; }
        .chat-msg.user { align-self: center; flex-direction: row-reverse; }

        .chat-avatar {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .chat-msg.ai .chat-avatar {
            background: linear-gradient(135deg, #06b6d4, #0ea5e9);
            box-shadow: 0 2px 8px rgba(6,182,212,0.3);
        }

        .chat-msg.user .chat-avatar {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
        }

        .chat-bubble {
            background: var(--bg-secondary);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 40%);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            font-size: var(--font-size-sm);
            line-height: 1.6;
            color: var(--text-primary);
            overflow-x: auto;
            flex: 1;
            min-width: 0;
        }

        .chat-msg.ai .chat-bubble {
            border-top-left-radius: 2px;
        }

        .chat-msg.user .chat-bubble {
            background: var(--accent-ghost);
            border-color: rgba(6,182,212,0.3);
            border-top-right-radius: 2px;
            max-width: 72ch;
            flex: initial;
        }

        /* Rótulo de autor + timestamp acima da bolha */
        .chat-bubble .chat-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .chat-bubble .chat-meta strong {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 12px;
        }
        .chat-bubble .chat-meta .model-tag {
            font-family: var(--font-family);
            font-size: 10px;
            padding: 1px 6px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            color: var(--text-muted);
        }

        .chat-bubble strong { color: var(--text-bright); }
        .chat-bubble .val { color: var(--syntax-lightblue); font-weight: 600; font-family: var(--font-family); }
        .chat-bubble .ok { color: var(--success); }
        .chat-bubble .warn { color: var(--warning); }
        .chat-bubble .crit { color: var(--error); }

        /* Tabelas — padrão Tufte: linhas horizontais, zero verticais, zebra sutil, numéricos à direita */
        .chat-bubble table, table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--font-size-sm);
            margin: 10px 0;
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .chat-bubble th, .chat-bubble td,
        table.data-table th, table.data-table td {
            padding: 9px 12px;
            border: none;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            vertical-align: middle;
        }

        .chat-bubble tr:last-child td,
        table.data-table tr:last-child td {
            border-bottom: none;
        }

        .chat-bubble tbody tr:nth-child(odd) td,
        table.data-table tbody tr:nth-child(odd) td {
            background: rgba(255,255,255,0.015);
        }

        .chat-bubble tbody tr:hover td,
        table.data-table tbody tr:hover td {
            background: var(--accent-ghost);
        }

        .chat-bubble th, table.data-table th {
            position: sticky;
            top: 0;
            background: var(--bg-tertiary);
            color: var(--text-bright);
            font-weight: 600;
            font-family: var(--font-ui);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border-strong);
            z-index: 1;
        }

        .chat-bubble td { font-family: var(--font-family); color: var(--text-primary); }

        /* Numéricos alinhados à direita — convenção em todas as tabelas */
        .chat-bubble td + td,
        table.data-table td + td {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .chat-bubble th + th,
        table.data-table th + th {
            text-align: right;
        }

        .chat-bubble .diagram-box {
            background: #1a1a2e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            margin: 8px 0;
            overflow-x: auto;
            text-align: center;
            position: relative;
        }

        [data-theme="light"] .chat-bubble .diagram-box { background: #f0f2f5; }
        .chat-bubble .diagram-box svg { max-width: 100%; height: auto; }

        /* Diagram toolbar */
        .diagram-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            margin-bottom: 6px;
        }

        .diagram-toolbar button {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: var(--transition);
        }

        .diagram-toolbar button:hover {
            background: var(--bg-hover);
            color: var(--text-bright);
            border-color: var(--accent);
        }

        .diagram-toolbar button svg {
            width: 16px;
            height: 16px;
        }

        /* Fullscreen overlay */
        .diagram-fullscreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .diagram-fullscreen-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,0,0,0.5);
            z-index: 1;
        }

        .diagram-fullscreen-bar span {
            color: #ccc;
            font-size: 13px;
            font-family: var(--font-ui);
            font-weight: 600;
        }

        .diagram-fullscreen-bar .fs-actions {
            display: flex;
            gap: 6px;
        }

        .diagram-fullscreen-bar button {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #ccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.15s ease;
        }

        .diagram-fullscreen-bar button:hover {
            background: rgba(255,255,255,0.18);
            color: #fff;
            border-color: rgba(255,255,255,0.4);
        }

        .diagram-fullscreen-bar button svg {
            width: 18px;
            height: 18px;
        }

        .diagram-fullscreen .diagram-fs-content {
            max-width: 95vw;
            max-height: 85vh;
            overflow: auto;
            padding: 20px;
        }

        .diagram-fullscreen .diagram-fs-content svg {
            width: 100%;
            height: auto;
            max-height: 80vh;
        }

        .chat-bubble .spec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 6px;
            margin: 8px 0;
        }

        .chat-bubble .spec-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 6px 10px;
        }

        .chat-bubble .spec-card small {
            color: var(--text-secondary);
            font-size: 10px;
            display: block;
        }

        .chat-bubble .spec-card span {
            color: var(--syntax-lightblue);
            font-weight: 700;
            font-family: var(--font-family);
            font-size: var(--font-size-sm);
        }

        .chat-bubble .reco-box {
            background: rgba(78, 201, 176, 0.08);
            border: 1px solid var(--success);
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 0;
            font-size: var(--font-size-xs);
        }

        .chat-bubble .int-list {
            list-style: none;
            padding: 0;
            margin: 6px 0;
        }

        .chat-bubble .int-list li {
            padding: 4px 8px;
            border-left: 3px solid var(--syntax-teal);
            background: var(--bg-tertiary);
            margin-bottom: 3px;
            border-radius: 0 4px 4px 0;
            font-size: var(--font-size-xs);
        }

        .chat-bubble .int-list li strong {
            color: var(--syntax-teal);
            font-size: 10px;
            display: block;
        }

        /* Barra de input do chat — ancorada e centrada */
        .chat-input-bar {
            display: flex;
            gap: 8px;
            padding: 14px var(--spacing-lg) 18px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            align-items: center;
            justify-content: center;
        }

        .chat-input-shell {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 780px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-xl);
            padding: 6px 8px 6px 16px;
            transition: var(--transition);
        }
        .chat-input-shell:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-ghost);
        }

        .chat-input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 8px 0;
            color: var(--text-primary);
            font-size: var(--font-size-base);
            font-family: var(--font-ui);
            outline: none;
        }

        .chat-input-bar input:focus { border: none; box-shadow: none; }
        .chat-input-bar input::placeholder { color: var(--text-muted); }

        .chat-input-bar .chat-send {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-input-bar .chat-send svg { width: 16px; height: 16px; }

        /* ============================================
           STATUS BAR (rodapé da aplicação)
           ============================================ */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 26px;
            padding: 0 14px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            font-family: var(--font-ui);
            color: var(--text-muted);
            gap: 16px;
            flex-shrink: 0;
        }
        .status-bar .status-left,
        .status-bar .status-right {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .status-bar .status-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-variant-numeric: tabular-nums;
        }
        .status-bar .status-item .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px rgba(16,185,129,0.5);
        }
        .status-bar .status-item.offline .dot { background: var(--text-muted); box-shadow: none; }
        .status-bar .status-item strong { color: var(--text-primary); font-weight: 600; }

        /* Typing indicator */
        .chat-typing {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .chat-typing span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typingDot 1.4s infinite;
        }

        .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
        .chat-typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header" role="banner">
            <div class="header-content">
                <div class="header-title">
                    <span class="logo-icon" aria-hidden="true">
                        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                            <path d="M32 10c-9 12-14 20-14 28a14 14 0 0 0 28 0c0-8-5-16-14-28z" fill="#ffffff" fill-opacity="0.95"/>
                            <path d="M22 28 L32 50 L42 28" stroke="#0b1220" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <h1>
                        VPO
                        <span class="product-sub">Vemba Process Optimizer</span>
                    </h1>
                    <span class="env-badge" title="Ambiente">FEED</span>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
                        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                        </svg>
                        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                    </button>
                    <button class="menu-toggle" onclick="toggleSidebar()">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3h14v1H1V3zm0 4h14v1H1V7zm0 4h14v1H1v-1z"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main -->
        <main class="app-main">
            <!-- Sidebar Overlay (Mobile) -->
            <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

            <!-- Sidebar Wrapper -->
            <div class="sidebar-wrapper" id="sidebarWrapper">
                <!-- Activity Bar -->
                <nav class="activity-bar">
                    <button class="activity-btn active" onclick="togglePanel()" title="Explorer">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M3 7V17C3 18.1 3.9 19 5 19H19C20.1 19 21 18.1 21 17V9C21 7.9 20.1 7 19 7H11L9 5H5C3.9 5 3 5.9 3 7Z"/>
                        </svg>
                    </button>
                    <button class="activity-btn" title="Pesquisar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="10" cy="10" r="6"/><path d="M21 21L15 15"/>
                        </svg>
                    </button>
                    <button class="activity-btn" title="Configurações">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                        </svg>
                    </button>
                    <div class="activity-spacer"></div>
                </nav>

                <!-- Sidebar Panel -->
                <aside class="sidebar" id="sidebar" aria-label="Parâmetros do processo">
                    <!-- Botão para re-expandir quando em modo rail -->
                    <button class="rail-expand" onclick="toggleRail()" aria-label="Expandir painel">
                        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3 L11 8 L6 13"/></svg>
                    </button>

                    <!-- Scenarios + Ações -->
                    <div class="scenario-bar">
                        <label for="scenarioSelect">Cenário operacional</label>
                        <div class="scenario-row">
                            <select class="scenario-select" id="scenarioSelect" onchange="applyScenario(this.value)" title="Pré-definições rápidas">
                                <option value="baseline">Baseline operacional</option>
                                <option value="highFlow">Pico de vazão</option>
                                <option value="lowPressure">Pressão reduzida</option>
                                <option value="highWaterCut">Água alta (BSW↑)</option>
                                <option value="custom" disabled>Personalizado</option>
                            </select>
                            <button class="icon-btn" onclick="resetAllParams()" title="Repor valores de baseline" aria-label="Reset">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8a5 5 0 1 0 1.5-3.5"/><path d="M3 3v3h3"/></svg>
                            </button>
                            <button class="icon-btn" onclick="toggleRail()" title="Colapsar painel" aria-label="Colapsar">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3 L5 8 L10 13"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="sidebar-section open" onclick="toggleSection(this)">
                        <h3>Parâmetros de Processo <span class="section-counter"><span class="dot-mod"></span><span data-counter="process">6</span></span></h3>
                        <div class="section-body">
                            <div class="input-group" data-param="flowRate">
                                <label>
                                    <span><span class="param-health" id="hFlowRate"></span>Vazão</span>
                                    <span class="input-value" id="flowRateValue" data-param-id="flowRate">1 250<span class="unit">m³/d</span></span>
                                </label>
                                <input type="range" id="flowRate" min="150" max="2400" value="1250" step="10" aria-label="Vazão em m³/dia">
                                <div class="input-bounds"><span>150</span><span class="delta-vs-base" id="dFlowRate">±0</span><span>2 400</span></div>
                            </div>

                            <div class="input-group" data-param="pressure">
                                <label>
                                    <span><span class="param-health" id="hPressure"></span>Pressão</span>
                                    <span class="input-value" id="pressureValue" data-param-id="pressure">11.3<span class="unit">bar</span></span>
                                </label>
                                <input type="range" id="pressure" min="8.5" max="15.2" value="11.3" step="0.1" aria-label="Pressão em bar">
                                <div class="input-bounds"><span>8.5</span><span class="delta-vs-base" id="dPressure">±0</span><span>15.2</span></div>
                            </div>

                            <div class="input-group" data-param="temperature">
                                <label>
                                    <span><span class="param-health" id="hTemperature"></span>Temperatura</span>
                                    <span class="input-value" id="temperatureValue" data-param-id="temperature">62<span class="unit">°C</span></span>
                                </label>
                                <input type="range" id="temperature" min="45" max="85" value="62" step="1" aria-label="Temperatura em graus Celsius">
                                <div class="input-bounds"><span>45</span><span class="delta-vs-base" id="dTemperature">±0</span><span>85</span></div>
                            </div>

                            <div class="input-group" data-param="waterCut">
                                <label>
                                    <span><span class="param-health" id="hWaterCut"></span>Corte de água</span>
                                    <span class="input-value" id="waterCutValue" data-param-id="waterCut">42<span class="unit">%</span></span>
                                </label>
                                <input type="range" id="waterCut" min="15" max="78" value="42" step="1" aria-label="Water cut percentual">
                                <div class="input-bounds"><span>15</span><span class="delta-vs-base" id="dWaterCut">±0</span><span>78</span></div>
                            </div>

                            <div class="input-group" data-param="gor">
                                <label>
                                    <span><span class="param-health" id="hGor"></span>GOR</span>
                                    <span class="input-value" id="gorValue" data-param-id="gor">95<span class="unit">m³/m³</span></span>
                                </label>
                                <input type="range" id="gor" min="45" max="180" value="95" step="5" aria-label="Gas-Oil Ratio">
                                <div class="input-bounds"><span>45</span><span class="delta-vs-base" id="dGor">±0</span><span>180</span></div>
                            </div>

                            <div class="input-group" data-param="viscosity">
                                <label>
                                    <span><span class="param-health" id="hViscosity"></span>Viscosidade</span>
                                    <span class="input-value" id="viscosityValue" data-param-id="viscosity">15<span class="unit">cP</span></span>
                                </label>
                                <input type="range" id="viscosity" min="10" max="30" value="15" step="1" aria-label="Viscosidade em centipoise">
                                <div class="input-bounds"><span>10</span><span class="delta-vs-base" id="dViscosity">±0</span><span>30</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-section open" onclick="toggleSection(this)">
                        <h3>Propriedades dos Fluidos <span class="section-counter"><span class="dot-mod"></span><span data-counter="fluids">3</span></span></h3>
                        <div class="section-body">
                            <div class="input-group" data-param="rhoOil">
                                <label>
                                    <span><span class="param-health" id="hRhoOil"></span>Densidade do óleo</span>
                                    <span class="input-value" id="rhoOilValue" data-param-id="rhoOil">870<span class="unit">kg/m³</span></span>
                                </label>
                                <input type="range" id="rhoOil" min="800" max="950" value="870" step="1" aria-label="Densidade do óleo">
                                <div class="input-bounds"><span>800</span><span class="delta-vs-base" id="dRhoOil">±0</span><span>950</span></div>
                            </div>

                            <div class="input-group" data-param="rhoWater">
                                <label>
                                    <span><span class="param-health" id="hRhoWater"></span>Densidade da água</span>
                                    <span class="input-value" id="rhoWaterValue" data-param-id="rhoWater">1 020<span class="unit">kg/m³</span></span>
                                </label>
                                <input type="range" id="rhoWater" min="1000" max="1100" value="1020" step="1" aria-label="Densidade da água">
                                <div class="input-bounds"><span>1 000</span><span class="delta-vs-base" id="dRhoWater">±0</span><span>1 100</span></div>
                            </div>

                            <div class="input-group" data-param="rhoGas">
                                <label>
                                    <span><span class="param-health" id="hRhoGas"></span>Densidade do gás</span>
                                    <span class="input-value" id="rhoGasValue" data-param-id="rhoGas">1.2<span class="unit">kg/m³</span></span>
                                </label>
                                <input type="range" id="rhoGas" min="0.7" max="2.0" value="1.2" step="0.1" aria-label="Densidade do gás">
                                <div class="input-bounds"><span>0.7</span><span class="delta-vs-base" id="dRhoGas">±0</span><span>2.0</span></div>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>

            <!-- Content -->
            <div class="main-content">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('dashboard')">
                        <span class="tab-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 2h6v5H1V2zm0 7h6v5H1V9zm8-7h6v5H9V2zm0 7h6v5H9V9zM2 3v3h4V3H2zm0 7v3h4v-3H2zm8-7v3h4V3h-4zm0 7v3h4v-3h-4z"/></svg></span>
                        Dashboard
                    </button>
                    <button class="tab" onclick="switchTab('modeling')">
                        <span class="tab-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 3.5L8 0l7 3.5v1L8 8 1 4.5v-1zM8 1.12L2.37 4 8 6.88 13.63 4 8 1.12zM1 7.5l7 3.5 7-3.5v1L8 12 1 8.5v-1zM1 11.5l7 3.5 7-3.5v1L8 16 1 12.5v-1z"/></svg></span>
                        Modelagem
                    </button>
                    <button class="tab" onclick="switchTab('neural')">
                        <span class="tab-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V6h3a2 2 0 0 1 2 2v.27c.6.34 1 .99 1 1.73a2 2 0 0 1-2 2c-.74 0-1.39-.4-1.73-1H10v1.27c.6.34 1 .99 1 1.73a2 2 0 1 1-3-1.73V11H5.73c-.34.6-.99 1-1.73 1a2 2 0 0 1-2-2c0-.74.4-1.39 1-1.73V8a2 2 0 0 1 2-2h3V4.73C7.4 4.39 7 3.74 7 3a2 2 0 0 1 1-1zM8 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM4 9a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm8 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-4 4a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg></span>
                        Redes Neurais

    <script>
        // Theme toggle with localStorage persistence
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('vpo-theme', next);
        }

        // Load saved theme on startup
        (function() {
            const saved = localStorage.getItem('vpo-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();

        // Toggle sidebar panel (expand/collapse)
        function togglePanel() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        // Toggle sidebar section (accordion)
        function toggleSection(el) {
            if (event.target.tagName === 'INPUT') return;
            el.classList.toggle('open');
        }

        // Mobile sidebar toggle
        function toggleSidebar() {
            const wrapper = document.getElementById('sidebarWrapper');
            const overlay = document.querySelector('.sidebar-overlay');
            wrapper.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Prevent section toggle when interacting with inputs
        document.querySelectorAll('.sidebar .input-group').forEach(el => {
            el.addEventListener('click', e => e.stopPropagation());
        });
    </script>
    <script src="app.js?v=2"></script>
